# Options Trading Configuration

# Short Straddle Strategies Configuration
straddle_strategies:
  - name: "btc_short_straddle"
    underlying: "BTC"           # BTC options
    entry_time: "17:00"         # IST — daily entry time (5:00 PM IST)
    exit_time: "17:30"          # IST — daily expiry / settlement time (5:30 PM IST)
    timezone: "Asia/Kolkata"    # IST
    capital_allocation_pct: 40   # % of available wallet balance to deploy per trade
    lot_size: null              # Enable dynamic lot sizing (null)
    max_lot_size: 1000          # Capped at maximum of 1,000 lots per leg
    leverage: 200               # 200x leverage
    order_type: "market_order"  # Market orders for instant fill
    skip_weekends: false        # Skip trading on Saturdays and Sundays (UTC/IST)
    stop_loss: null
    # Big-leg explosion guard — exit early if the dominant leg (higher-premium)
    # rises more than 30% above its entry price during the settlement window.
    # Backtest (535 trades): >30% explosion → 87%+ loss rate.
    # Set to 0 to disable. Applies only to the 30-min straddle window.
    big_leg_explosion_pct: 30
    # Minimum asymmetry ratio (big_leg_entry / small_leg_entry) required to
    # activate the guard. Backtest finding:
    #   ratio >= 2x: ALL explosions ended in loss (100%, 97/97 trades)
    #   ratio <  2x: only 63.6% loss rate — balanced straddles, guard stays silent
    big_leg_min_ratio: 2
    momentum_filter:
      enabled: true              # Skip entry if BTC exhibits strong pre-entry momentum
      lookback_hours: 2          # Check price change over the 2 hours before entry
      threshold_pct: 1.2         # Skip trade if BTC moved more than 1.2% in that window
    monitor_interval_sec: 60     # Poll interval when SL is active (unused when stop_loss: null)


  - name: "btc_otm2_revmom_strangle"
    underlying: "BTC"           # BTC options
    entry_time: "13:00"         # IST — daily entry time (1:00 PM IST / 07:30 UTC)
    exit_time: "17:30"          # IST — daily expiry / settlement time (5:30 PM IST)
    timezone: "Asia/Kolkata"    # IST
    capital_allocation_pct: 30  # 30% of available wallet balance to deploy per trade
    lot_size: null              # Enable dynamic lot sizing (null)
    max_lot_size: 1000          # Capped at maximum of 1,000 lots per leg
    leverage: 200               # 200x leverage
    order_type: "market_order"  # Market orders for instant fill
    skip_weekends: false        # Skip trading on Saturdays and Sundays (UTC/IST)
    stop_loss: null             # No SL — let trades expire at settlement
    otm_steps: 2                # Select ATM±2 strikes (±$400)
    momentum_filter:
      enabled: true             # Reverse momentum filter
      reverse: true             # Enter ONLY when move > threshold
      lookback_hours: 2         # Check price change over the 2 hours before entry
      threshold_pct: 0.5        # Enter when |move| > 0.5%
    monitor_interval_sec: 60    # Poll interval when SL is active (unused when stop_loss: null)

  - name: "xaut_short_straddle"
    enabled: false               # Temporarily disabled
    underlying: "XAUT"          # XAUT options
    entry_time: "21:00"         # IST — daily entry time (9:00 PM IST)
    exit_time: "21:30"          # IST — daily expiry / settlement time (9:30 PM IST)
    timezone: "Asia/Kolkata"    # IST
    capital_allocation_pct: 20   # % of available wallet balance to deploy per trade
    lot_size: null              # Enable dynamic lot sizing (null)
    max_lot_size: 1000          # Capped at maximum of 1,000 lots per leg
    leverage: 100               # 100x leverage for XAUT
    order_type: "market_order"  # Market orders for instant fill
    skip_weekends: false        # Skip trading on Saturdays and Sundays (UTC/IST)
    stop_loss: null
    monitor_interval_sec: 60     # Poll interval when SL is active (unused when stop_loss: null)

# Gold ORB Strategy Configuration
strategies:
  gold_orb:
    symbol: "XAUTUSD"
    trade_mode: "Both"        # "Long", "Short", or "Both"
    orb_start_hour_ist: 6     # 06:30 IST candle
    orb_start_minute_ist: 30
    pct_threshold: 0.005      # 0.5% price movement threshold from ORB close
    rr_ratio: 1.25            # 1:1.25 Risk/Reward ratio
    fixed_lot_size: 1000      # 1000 contracts fixed
    leverage: 100             # 100x leverage



# Notification Settings
notifications:
  discord_enabled: true
  alert_on_entry: true
  alert_on_exit: true
  alert_on_sl_hit: true
  alert_on_error: true

# Firestore Configuration (for trade journaling)
# Uses the same Firebase project as the futures bot
# Data is stored in the "options" collection
# mode: 'live' (production) or 'paper' (testnet)
firestore:
  enabled: true
  service_account_path: "config/firestore-service-account.json"
  collection_name: "options"
